<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- りかラボ：てこ（6年）のうでの先から、ふりこ（5年）がゆれている -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1b2c5e"/><stop offset="1" stop-color="#070b18"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a5680"/><stop offset=".45" stop-color="#b9c4e2"/><stop offset="1" stop-color="#3d4870"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6a96"/><stop offset="1" stop-color="#2a3352"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2b4a8a" stroke-width="1.5" opacity=".45"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect y="360" width="512" height="152" fill="url(#grid)"/>
  <ellipse cx="200" cy="420" rx="86" ry="18" fill="none" stroke="#22d3ee" stroke-width="6" filter="url(#glow)"/>
  <!-- 台と支点 -->
  <rect x="189" y="170" width="22" height="250" fill="url(#metal)"/>
  <!-- うで -->
  <rect x="60" y="150" width="392" height="26" rx="13" fill="url(#beam)"/>
  <rect x="78" y="154" width="110" height="5" rx="2.5" fill="#22d3ee" filter="url(#glow)"/>
  <rect x="214" y="154" width="220" height="5" rx="2.5" fill="#f472b6" filter="url(#glow)"/>
  <circle cx="200" cy="163" r="13" fill="#facc15" filter="url(#glow)"/>
  <!-- 左：てこのおもり -->
  <line x1="98" y1="176" x2="98" y2="214" stroke="#b9c4e2" stroke-width="4"/>
  <rect x="66" y="214" width="64" height="66" rx="13" fill="#fb923c"/>
  <!-- 右：ふりこ（ゆれの軌跡と、少しずれた残像） -->
  <path d="M296 370 A196 196 0 0 0 488 370" fill="none" stroke="#67e8f9" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round" opacity=".7"/>
  <line x1="392" y1="176" x2="330" y2="360" stroke="#b9c4e2" stroke-width="3" opacity=".25"/>
  <circle cx="327" cy="370" r="22" fill="#2dd4bf" opacity=".22"/>
  <line x1="392" y1="176" x2="444" y2="362" stroke="#b9c4e2" stroke-width="4"/>
  <circle cx="447" cy="374" r="28" fill="#2dd4bf" filter="url(#glow)"/>
  <circle cx="392" cy="176" r="7" fill="#facc15"/>
</svg>
